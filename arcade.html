<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
height: 100vh;
background: #000;
color: #fff;
overflow: hidden;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

#bg {
position: fixed;
inset: 0;
background-size: cover;
background-position: center;
transition: background-image 0.5s ease, filter 0.5s ease;
filter: brightness(0.4);
z-index: 0;
}

#ui-container {
position: fixed;
inset: 0;
transition: opacity 0.3s ease;
z-index: 10;
}

#ui-container.hidden {
opacity: 0;
pointer-events: none;
}

#drop-zone {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
color: #333;
font-size: 1.5rem;
font-weight: 600;
letter-spacing: 2px;
text-transform: uppercase;
background: #050505;
transition: color 0.2s, background 0.2s;
}

#drop-zone.over {
color: #fff;
background: #111;
}

#bar-container {
position: absolute;
top: 20%;
left: 0;
width: 100%;
display: flex;
justify-content: center;
}

#game-bar {
display: flex;
gap: 20px;
padding: 30px;
overflow-x: auto;
scroll-behavior: smooth;
max-width: 90%;
}

#game-bar::-webkit-scrollbar { display: none; }
#game-bar { -ms-overflow-style: none; scrollbar-width: none; }

.tile {
width: 100px;
height: 100px;
background: #1a1a1a;
flex-shrink: 0;
border-radius: 12px;
opacity: 0.4;
transform: scale(0.9);
transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
background-size: cover;
background-position: center;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
display: flex;
align-items: center;
justify-content: center;
}

.tile.selected {
opacity: 1;
transform: scale(1.2) translateY(10px);
box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

#runtime-container {
position: fixed;
inset: 0;
background: #000;
display: none;
z-index: 100;
}

#runtime-container.active {
display: block;
}

#runtime-container iframe {
width: 100%;
height: 100%;
border: none;
background: #000;
}

.placeholder {
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.8rem;
color: #555;
text-align: center;
word-break: break-all;
}
</style>

</head>
<body>
<div id="bg"></div>

<div id="ui-container">
<div id="drop-zone">Click or Drop Folder Here</div>
<div id="bar-container" style="display:none;">
<div id="game-bar"></div>
</div>
</div>

<div id="runtime-container"></div>

<script>
// ── Core App Logic ───────────────────────────────────────────────
const ROM_MAP = {
'nes': 'nes', 'fds': 'nes',
'sfc': 'snes', 'smc': 'snes',
'n64': 'n64', 'z64': 'n64',
'gb': 'gb', 'gbc': 'gb',
'gba': 'gba',
'nds': 'nds',
'bin': 'segaMD', 'md': 'segaMD', 'smd': 'segaMD', 'gen': 'segaMD',
'iso': 'psx', 'pbp': 'psx', 'ecm': 'psx',
'32x': 'sega32x',
'gg': 'segaGG',
'sms': 'segaMS'
};

let games = [];
let selectedIndex = 0;

const dropZone = document.getElementById('drop-zone');
const folderInput = document.getElementById('folderInput');
const barContainer = document.getElementById('bar-container');
const gameBar = document.getElementById('game-bar');
const uiContainer = document.getElementById('ui-container');
const runtimeContainer = document.getElementById('runtime-container');
const bg = document.getElementById('bg');

dropZone.addEventListener('click', () => folderInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', async (e) => {
e.preventDefault();
dropZone.classList.remove('over');
const files = [];
for (const item of Array.from(e.dataTransfer.items)) {
const entry = item.webkitGetAsEntry?.();
if (entry) await walk(entry, files);
else if (item.getAsFile()) files.push(item.getAsFile());
}
processFiles(files);
});

folderInput.addEventListener('change', e => processFiles(Array.from(e.target.files)));

async function walk(entry, out) {
if (entry.isFile) out.push(await new Promise(r => entry.file(r)));
else if (entry.isDirectory) {
const reader = entry.createReader();
const entries = await new Promise(r => { let a=[]; const q=()=>reader.readEntries(b=>b.length?(a.push(...b),q()):r(a)); q(); });
for (const e of entries) await walk(e, out);
}
}

function processFiles(files) {
if (!files.length) return;
const tempGames = {};

files.forEach(file => {
const name = file.name.toLowerCase();
const path = file.webkitRelativePath || file.name;

if (name.endsWith('.ds_store') || name.startsWith('.') || path.includes('__macosx')) return;

let type = null, core = null, base = name;

if (name.endsWith('-bg.png')) { type = 'bg'; base = name.slice(0, -7); }
else if (name.endsWith('.png')) { type = 'thumb'; base = name.slice(0, -4); }
else if (name.endsWith('.jam')) { type = 'jam'; base = name.slice(0, -4); }
else if (name.endsWith('.swf')) { type = 'flash'; base = name.slice(0, -4); }
else {
const ext = name.split('.').pop();
if (ROM_MAP[ext]) { type = 'emulator'; core = ROM_MAP[ext]; base = name.slice(0, -ext.length - 1); }
}

if (!type) return;

if (!tempGames[base]) tempGames[base] = { id: base, runner: null, core: null, thumb: null, bg: null, file: null, name: base };

if (type === 'jam' || type === 'flash' || type === 'emulator') {
tempGames[base].runner = type;
tempGames[base].core = core;
tempGames[base].file = file;
tempGames[base].name = file.name;
} else if (type === 'thumb') {
tempGames[base].thumb = URL.createObjectURL(file);
} else if (type === 'bg') {
tempGames[base].bg = URL.createObjectURL(file);
}
});

games = Object.values(tempGames).filter(g => g.runner !== null);

// Sort alphabetically by ID
games.sort((a, b) => a.id.localeCompare(b.id));
// Stable sort: move games with thumbnails to the front
games.sort((a, b) => (b.thumb ? 1 : 0) - (a.thumb ? 1 : 0));

if (games.length > 0) {
dropZone.style.display = 'none';
barContainer.style.display = 'flex';
renderBar();
selectedIndex = 0;
updateSelection();
}
}

function renderBar() {
gameBar.innerHTML = '';
games.forEach((g, i) => {
const tile = document.createElement('div');
tile.className = 'tile';
if (g.thumb) {
tile.style.backgroundImage = `url('${g.thumb}')`;
} else {
tile.innerHTML = `<div class="placeholder">${g.name.substring(0, 10)}</div>`;
}
gameBar.appendChild(tile);
});
}

function updateSelection() {
const tiles = document.querySelectorAll('.tile');
tiles.forEach((t, i) => t.classList.toggle('selected', i === selectedIndex));

const game = games[selectedIndex];
if (game && game.bg) {
bg.style.backgroundImage = `url('${game.bg}')`;
} else {
bg.style.backgroundImage = 'none';
}

const selectedTile = tiles[selectedIndex];
if (selectedTile) {
const barRect = gameBar.getBoundingClientRect();
const tileRect = selectedTile.getBoundingClientRect();
const scrollLeft = selectedTile.offsetLeft - (gameBar.offsetLeft) - (barRect.width / 2) + (tileRect.width / 2);
gameBar.scrollTo({ left: scrollLeft, behavior: 'smooth' });
}
}

document.addEventListener('keydown', (e) => {
if (games.length === 0) return;

if (uiContainer.classList.contains('hidden')) {
if (e.key === 'Escape') exitGame();
return;
}

if (e.key === 'ArrowRight') {
e.preventDefault();
selectedIndex = Math.min(selectedIndex + 1, games.length - 1);
updateSelection();
} else if (e.key === 'ArrowLeft') {
e.preventDefault();
selectedIndex = Math.max(selectedIndex - 1, 0);
updateSelection();
} else if (e.key === 'Enter') {
e.preventDefault();
launchGame(games[selectedIndex]);
}
});

function launchGame(game) {
uiContainer.classList.add('hidden');
runtimeContainer.classList.add('active');
runtimeContainer.innerHTML = ''; // Clear previous game state (isolates EmulatorJS/JAM perfectly)

const iframe = document.createElement('iframe');
iframe.setAttribute('allow', 'autoplay; fullscreen; gamepad; cross-origin-isolated');
runtimeContainer.appendChild(iframe);

if (game.runner === 'jam') {
runJam(iframe, game.file);
} else if (game.runner === 'flash') {
runFlash(iframe, game.file);
} else if (game.runner === 'emulator') {
runEmulator(iframe, game.file, game.core);
}
}

function exitGame() {
uiContainer.classList.remove('hidden');
runtimeContainer.classList.remove('active');
runtimeContainer.innerHTML = ''; // Nuke the iframe to kill all game processes
}

// ── Runners ──────────────────────────────────────────────────────

function runJam(iframe, file) {
const fjamCode = document.getElementById('fjam-code').textContent;
iframe.srcdoc = `<html><head><style>*{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}</style></head><body><script type="module">${fjamCode}<\/script></body></html>`;
iframe.onload = () => {
iframe.contentWindow.postMessage({ type: 'run_jam', file: file }, '*');
};
}

function runFlash(iframe, file) {
const swfUrl = URL.createObjectURL(file);
iframe.srcdoc = `
<html><head><style>*{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}#ruffle{width:100%;height:100%}</style></head>
<body><div id="ruffle"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { "autoplay": "on", "unmuteOverlay": "visible" };
window.addEventListener('load', () => {
const r = window.RufflePlayer.newest();
const p = r.create_player();
document.getElementById('ruffle').appendChild(p);
p.load({ url: '${swfUrl}' });
});
<\/script>
</body></html>
`;
}

function runEmulator(iframe, file, core) {
const romUrl = URL.createObjectURL(file);
