<style>

<body>
<input type="file" id="up" webkitdirectory directory multiple hidden>
<input type="file" id="pack-up" webkitdirectory directory multiple hidden>
<div id="status"></div>
<div id="grid" class="hidden"></div>
<div id="player-layer"><div id="player-content"></div></div>

<script type="module">
import * as fflate from 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm';

/* ── Base122 ───────────────────────────────────────────────── */
const B122=(()=>{const I=[0,10,13,34,38,92],M=new Int8Array(128).fill(-1);I.forEach((v,i)=>M[v]=i);
return{
enc(d){const o=new Uint8Array(d.length*1.5+10);let oi=0,a=0,b=0;
for(let i=0;i<d.length;i++){a=(a<<8)|d[i];b+=8;
while(b>=7){b-=7;const v=(a>>>b)&0x7F,il=M[v];
if(il!==-1){let n=-1;if(b<7&&i+1<d.length){a=(a<<8)|d[++i];b+=8;}
if(b>=7){b-=7;n=(a>>>b)&0x7F;}
if(n===-1){o[oi++]=0xC2|(7<<2)|(v>>6);o[oi++]=0x80|(v&0x3F);}
else{o[oi++]=0xC2|(il<<2)|(n>>6);o[oi++]=0x80|(n&0x3F);}}else o[oi++]=v;}}
if(b>0){const v=(a<<(7-b))&0x7F;if(M[v]!==-1){o[oi++]=0xC2|(7<<2)|(v>>6);o[oi++]=0x80|(v&0x3F);}else o[oi++]=v;}
return o.subarray(0,oi);},
dec(d){const o=new Uint8Array(d.length);let oi=0,a=0,b=0;
for(let i=0;i<d.length;i++){const c=d[i];
if(c>127){const il=(c>>>2)&7,n=d[++i]&0x3F;
if(il!==7){a=(a<<7)|I[il];if((b+=7)>=8)o[oi++]=(a>>>(b-=8))&0xFF;}
a=(a<<7)|(((c&1)<<6)|n);if((b+=7)>=8)o[oi++]=(a>>>(b-=8))&0xFF;}
else{a=(a<<7)|c;if((b+=7)>=8)o[oi++]=(a>>>(b-=8))&0xFF;}}
return o.subarray(0,oi);}}})();

/* ── MIME ──────────────────────────────────────────────────── */
const MIME={html:'text/html',htm:'text/html',css:'text/css',txt:'text/plain',
js:'application/javascript',mjs:'application/javascript',json:'application/json',
wasm:'application/wasm',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',
gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',ico:'image/x-icon',bmp:'image/bmp',
mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',
mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',
ttf:'font/ttf',woff:'font/woff',woff2:'font/woff2',otf:'font/otf',
pck:'application/octet-stream',unityweb:'application/octet-stream',
bin:'application/octet-stream',data:'application/octet-stream',
love:'application/octet-stream',pak:'application/octet-stream',
glb:'model/gltf-binary',gltf:'model/gltf+json',
xml:'application/xml',pdf:'application/pdf',webmanifest:'application/manifest+json'};
const mime=p=>{let l=p.toLowerCase().replace(/\.part\d+$/,'');
if(l.endsWith('.wasm.code.unityweb')||l.endsWith('.wasm.framework.unityweb'))return 'application/wasm';
return MIME[l.split('.').pop()]||'application/octet-stream';};

/* ── VFS (with import map — this was the missing piece) ────── */
class VFS{
    constructor(files){
        this.blobs=new Map();this.index=new Map();
        this.importMap={imports:{}};this.entry=null;
        this._build(files);
    }
    _build(files){
        const htmls=[...files.keys()].filter(p=>/\.html?$/i.test(p));
        htmls.sort((a,b)=>{
            const aD=a.split('/').length,bD=b.split('/').length;
            return aD!==bD?aD-bD:a.length-b.length;
        });
        this.entry=htmls.find(p=>/(^|\/)index\.html?$/i.test(p))||htmls[0];
        const base=this.entry&&this.entry.includes('/')?this.entry.slice(0,this.entry.lastIndexOf('/')+1):'';
        for(const[path,data]of files){
            if(path.endsWith('/')||path.includes('__MACOSX')||path.endsWith('.DS_Store'))continue;
            const cp=path.replace(/\\/g,'/').replace(/^\/+/,'');
            const url=URL.createObjectURL(new Blob([data],{type:mime(cp)}));
            this.blobs.set(cp,url);
            const forms=new Set([cp,'/'+cp,'./'+cp,cp.split('/').pop()]);
            if(base&&cp.startsWith(base)){
                const rel=cp.slice(base.length);
                forms.add(rel);forms.add('/'+rel);forms.add('./'+rel);
            }
            forms.add(cp+'.part1');
            for(const f of forms)if(!this.index.has(f))this.index.set(f,url);
            // Build import map for JS/WASM — critical for ES modules
            if(/\.(m?js|wasm)$/i.test(cp)){
                const specs=[cp,'/'+cp,'./'+cp,cp.split('/').pop()];
                if(base&&cp.startsWith(base)){
                    const rel=cp.slice(base.length);
                    specs.push(rel,'/'+rel,'./'+rel);
                }
                for(const s of specs){
                    if(!this.importMap.imports[s])this.importMap.imports[s]=url;
                }
            }
        }
    }
    resolve(url){
        if(!url||typeof url!=='string'||url.startsWith('blob:')||url.startsWith('data:'))return url;
        if(this.index.has(url))return this.index.get(url);
        try{
            const path=decodeURIComponent(new URL(url,'http://vfs.local/').pathname).replace(/^\//,'');
            if(this.index.has(path))return this.index.get(path);
            const fn=path.split('/').pop();
            if(this.index.has(fn))return this.index.get(fn);
        }catch(e){}
        return url;
    }
    getEntry(){return this.entry?this.blobs.get(this.entry):null;}
    getImportMap(){return this.importMap;}
    destroy(){
        for(const url of this.blobs.values())URL.revokeObjectURL(url);
        this.blobs.clear();this.index.clear();
    }
}

/* ── JAM Load/Pack ─────────────────────────────────────────── */
async function loadJam(file){
    const buf=await file.arrayBuffer();
    const view=new DataView(buf);
    if(view.getUint32(0,false)!==0x4A414D00)throw new Error('Invalid .JAM file');
    const payload=new Uint8Array(buf,8,view.getUint32(4,true));
    return new Map(Object.entries(fflate.unzipSync(B122.dec(payload))));
}
async function packJam(fileList){
    const map={};
    for(const{path,file}of fileList){
        const cp=path.replace(/\\/g,'/');
        if(cp.includes('__MACOSX')||cp.endsWith('.DS_Store'))continue;
        map[cp]=new Uint8Array(await file.arrayBuffer());
    }
    const payload=B122.enc(fflate.zipSync(map,{level:1}));
    const hdr=new Uint8Array([74,65,77,0]);
    const len=new Uint8Array(4);
    new DataView(len.buffer).setUint32(0,payload.length,true);
    const blob=new Blob([hdr,len,payload],{type:'application/octet-stream'});
    const first=fileList.find(f=>f.path.includes('/'));
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=(first?first.path.split('/')[0]:'app')+'.jam';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),10000);
}

/* ── JAM Runtime — injected into iframe ────────────────────── */
function jamRuntime(vfsIndex){
    const serialized=JSON.stringify([...vfsIndex]);
    return `
(function(){
    'use strict';
    const INDEX=new Map(${serialized});
    function resolve(url){
        if(!url||typeof url!=='string')return url;
        if(url.startsWith('blob:')||url.startsWith('data:'))return url;
        if(url.startsWith('http://')||url.startsWith('https://'))return url;
        if(INDEX.has(url))return INDEX.get(url);
        try{
            const parsed=new URL(url,'http://vfs.local/');
            const path=decodeURIComponent(parsed.pathname).replace(/^\\//,'');
            if(INDEX.has(path))return INDEX.get(path);
            const filename=path.split('/').pop();
            if(INDEX.has(filename))return INDEX.get(filename);
        }catch(e){}
        return url;
    }
    try{
        Object.defineProperty(document,'baseURI',{
            get:()=>'http://vfs.local/',configurable:true
        });
    }catch(e){}
    const _fetch=window.fetch;
    window.fetch=function(input,init){
        const url=input instanceof Request?input.url:input;
        const resolved=resolve(url);
        if(resolved!==url){
            if(input instanceof Request)return _fetch(new Request(resolved,input),init);
            return _fetch(resolved,init);
        }
        return _fetch(input,init);
    };
    const _xhrOpen=XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open=function(method,url,...rest){
        return _xhrOpen.call(this,method,resolve(url),...rest);
    };
    const _origSet=Object.getOwnPropertyDescriptor(Element.prototype,'setAttribute');
    function patchProperty(ctor,prop){
        if(!ctor)return;
        const desc=Object.getOwnPropertyDescriptor(ctor.prototype,prop);
        if(!desc||!desc.set)return;
        Object.defineProperty(ctor.prototype,prop,{
            set:function(v){desc.set.call(this,resolve(v));},
            get:desc.get,configurable:true
        });
    }
    patchProperty(HTMLScriptElement,'src');
    patchProperty(HTMLImageElement,'src');
    patchProperty(HTMLLinkElement,'href');
    patchProperty(HTMLIFrameElement,'src');
    patchProperty(HTMLSourceElement,'src');
    patchProperty(HTMLVideoElement,'src');
    patchProperty(HTMLAudioElement,'src');
    patchProperty(HTMLObjectElement,'data');
    Element.prototype.setAttribute=function(name,value){
        const lower=name.toLowerCase();
        if(lower==='src'||lower==='href'||lower==='data'){
            return _origSet.value.call(this,name,resolve(value));
        }
        return _origSet.value.call(this,name,value);
    };
    const _Worker=window.Worker;
    window.Worker=function(url,options){
        return new _Worker(resolve(url),options);
    };
    window.Worker.prototype=_Worker.prototype;
    const _Audio=window.Audio;
    window.Audio=function(src){
        return src?new _Audio(resolve(src)):new _Audio();
    };
    window.Audio.prototype=_Audio.prototype;
    try{
        Object.defineProperty(window,'top',{get:()=>window.self,configurable:true});
        Object.defineProperty(window,'parent',{get:()=>window.self,configurable:true});
        Object.defineProperty(window,'frameElement',{get:()=>null,configurable:true});
    }catch(e){}
})();
`;
}

/* ── HTML Processing ───────────────────────────────────────── */
async function processHTML(html,vfs){
    html=html.replace(/<base\b[^>]*\/?>/gi,'');
    const scripts=[];
    html=html.replace(/<script([^>]*)>([\s\S]*?)<\/script>/gi,(m,a,c)=>{
        scripts.push(c);
        return `<script${a}>\x00SCRIPT${scripts.length-1}\x00</`+`script>`;
    });
    html=html.replace(/((?:src|href|data)\s*=\s*["'])([^"']+)(["'])/gi,(m,pre,url,post)=>{
        const resolved=vfs.resolve(url);
        return resolved!==url?pre+resolved+post:m;
    });
    html=html.replace(/(url\(\s*["']?)([^"')]+)(["']?\s*\))/gi,(m,pre,url,post)=>{
        const resolved=vfs.resolve(url);
        return resolved!==url?pre+resolved+post:m;
    });
    html=html.replace(/\x00SCRIPT(\d+)\x00/g,(m,i)=>scripts[parseInt(i)]);
    return html;
}

/* ── Core Detection ────────────────────────────────────────── */
const CORE_MAP={
    nes:["nes","fds"],snes:["smc","sfc","swc"],n64:["z64","n64","v64"],
    gb:["gb","gbc"],gba:["gba"],nds:["nds"],psx:["ps1","psx","bin","img"],
    segaMD:["gen","md"],segaMS:["sms"],segaGG:["gg"],pce:["pce"],
    ngp:["ngp"],ws:["ws","wsc"],vb:["vb"],lynx:["lnx"],
    atari2600:["a26"],atari7800:["a78"],coleco:["col"],vice_x64:["d64"]
};
const LABELS={
    n64:"N64",gb:"Game Boy",gba:"GBA",nds:"DS",nes:"NES",snes:"SNES",psx:"PS1",
    vb:"Virtual Boy",segaMD:"Genesis",segaMS:"Master System",lynx:"Lynx",
    segaGG:"Game Gear",atari7800:"Atari 7800",atari2600:"Atari 2600",
    pce:"PC Engine",ngp:"NeoGeo Pocket",ws:"WonderSwan",coleco:"ColecoVision",
    vice_x64:"C64",flash:"Flash",jam:"JAM"
};
const BLACKLIST=['png','jpg','jpeg','webp','gif','svg','js','css','json','txt','ico','html','htm'];

/* ── State ─────────────────────────────────────────────────── */
let items=[],groups=new Map(),imgMap=new Map();
let currentView='init',currentSystem=null,currentVfs=null;
const blobCache=new Map();
const grid=document.getElementById('grid');
const playerLayer=document.getElementById('player-layer');
const playerContent=document.getElementById('player-content');
const statusEl=document.getElementById('status');
function setStatus(msg){
    statusEl.textContent=msg;
    if(msg)setTimeout(()=>{if(statusEl.textContent===msg)statusEl.textContent='';},3000);
}

/* ── Scanning ──────────────────────────────────────────────── */
function processFiles(files){
    imgMap.forEach(u=>URL.revokeObjectURL(u));imgMap.clear();
    blobCache.forEach(u=>URL.revokeObjectURL(u));blobCache.clear();
    files.forEach(f=>{
        const ln=f.name.toLowerCase();
        if(ln.match(/\.(png|jpg|jpeg|webp)$/)){
            const name=f.name.substring(0,f.name.lastIndexOf('.')).toLowerCase();
            imgMap.set(name,URL.createObjectURL(f));
        }
    });
    items=files.filter(f=>!f.name.startsWith('.')&&f.size>0).map(f=>{
        const ext=f.name.split('.').pop().toLowerCase();
        const name=f.name.substring(0,f.name.lastIndexOf('.'))||f.name;
        let type='emu',core=null;
        if(ext==='swf'){type='flash';core='flash';}
        else if(ext==='jam'){type='jam';core='jam';}
        else if(BLACKLIST.includes(ext))return null;
        else{
            for(const[c,exts]of Object.entries(CORE_MAP))
                if(exts.includes(ext)){core=c;break;}
            if(!core)return null;
        }
        return{name,file:f,path:f.webkitRelativePath||f.name,type,core,ext,thumb:imgMap.get(name.toLowerCase())};
    }).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
    groups.clear();
    items.forEach(i=>{
        if(!groups.has(i.core))groups.set(i.core,[]);
        groups.get(i.core).push(i);
    });
    if(items.length){
        grid.classList.remove('hidden');
        currentView='systems';
        render();
        setStatus(items.length+' files loaded');
    }
}

/* ── Rendering ─────────────────────────────────────────────── */
function render(){
    if(currentView==='systems'){
        grid.innerHTML=[...groups.keys()].sort().map(core=>{
            const games=groups.get(core);
            const label=LABELS[core]||core;
            return `<div class="card" data-core="${core}">
                <div class="sq">${games[0].thumb?`<img src="${games[0].thumb}">`:`<span>${label}</span>`}</div>
                <div class="title">${label} (${games.length})</div>
            </div>`;
        }).join('');
    }else if(currentView==='games'&&currentSystem){
        const games=groups.get(currentSystem)||[];
        grid.innerHTML=games.map(item=>`
            <div class="card" data-idx="${items.indexOf(item)}">
                <div class="sq">${item.thumb?`<img src="${item.thumb}">`:''}</div>
                <div class="title">${item.name}</div>
            </div>`).join('');
    }
}
grid.addEventListener('click',e=>{
    const card=e.target.closest('.card');
    if(!card)return;
    if(card.dataset.core){
        currentView='games';currentSystem=card.dataset.core;render();
    }else if(card.dataset.idx!==undefined){
        launch(items[+card.dataset.idx]);
    }
});

/* ── Launchers ─────────────────────────────────────────────── */
function frame(html){
    const ifr=document.createElement('iframe');
    ifr.style.cssText='width:100%;height:100%;border:none;';
    playerContent.replaceChildren(ifr);
    ifr.contentWindow.document.open();
    ifr.contentWindow.document.write(html);
    ifr.contentWindow.document.close();
    return ifr;
}
function launch(item){
    playerLayer.style.display='block';
    playerContent.innerHTML='';
    if(item.type==='flash'){
        const url=URL.createObjectURL(item.file);
        frame(`<html><head><title>${item.name}</title><style>body,html{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}</style></head><body>
<script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script>
<div id="r" style="width:100%;height:100%"></div>
<script>window.RufflePlayer=window.RufflePlayer||{};const r=window.RufflePlayer.newest();const p=r.createPlayer();p.style.width='100%';p.style.height='100%';document.getElementById('r').appendChild(p);p.load({url:"${url}"});<\/script>
</body></html>`);
    }else if(item.type==='jam'){
        launchJam(item);
    }else{
        const url=URL.createObjectURL(item.file);
        const name=item.name.replace(/"/g,'&quot;');
        frame(`<html><head><title>${name}</title></head><body style="margin:0;background:#000;">
<div id="ejs" style="width:100vw;height:100vh;"></div>
<script>
window.EJS_player='#ejs';window.EJS_gameName="${name}";window.EJS_gameUrl="${url}";
window.EJS_core="${item.core}";window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
window.EJS_startOnLoaded=true;window.EJS_disableDatabases=true;
const s=document.createElement('script');s.src="https://cdn.emulatorjs.org/stable/data/loader.js";document.body.appendChild(s);
<\/script></body></html>`);
    }
}

async function launchJam(item){
    try{
        setStatus('Loading '+item.name+'...');
        const files=await loadJam(item.file);
        currentVfs=new VFS(files);
        const entry=currentVfs.getEntry();
        if(!entry)throw new Error('No HTML entry in JAM');
        const html=await processHTML(await(await fetch(entry)).text(),currentVfs);
        const runtime=jamRuntime(currentVfs.index);
        const importMap=JSON.stringify(currentVfs.getImportMap());

        // Inject BOTH import map AND runtime — import map was the missing piece
        const injectStr=
            `<script type="importmap">${importMap}</`+`script>`+
            `<script>${runtime}</`+`script>`;

        let finalHTML;
        const headIdx=html.toLowerCase().indexOf('<head>');
        if(headIdx!==-1){
            finalHTML=html.slice(0,headIdx+6)+injectStr+html.slice(headIdx+6);
        }else{
            finalHTML=injectStr+html;
        }

        const ifr=document.createElement('iframe');
        ifr.style.cssText='width:100%;height:100%;border:none;';
        ifr.srcdoc=finalHTML;
        playerContent.replaceChildren(ifr);
        setStatus('');
    }catch(err){
        setStatus('JAM error: '+err.message);
        console.error('[jam]',err);
    }
}

/* ── Navigation ────────────────────────────────────────────── */
function goHome(){
    if(playerLayer.style.display==='block'){
        playerContent.querySelectorAll('iframe').forEach(i=>{
            try{i.contentWindow.document.open();i.contentWindow.document.write('');i.contentWindow.document.close();}catch(e){}
            i.remove();
        });
        playerContent.innerHTML='';
        if(currentVfs){currentVfs.destroy();currentVfs=null;}
        blobCache.forEach(u=>URL.revokeObjectURL(u));blobCache.clear();
        playerLayer.style.display='none';
    }
    currentView='systems';currentSystem=null;
    if(items.length)render();
}
function toggleFullscreen(){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
}

/* ── Wire-up ───────────────────────────────────────────────── */
document.getElementById('btn-upload').addEventListener('click',()=>document.getElementById('up').click());
document.getElementById('btn-pack').addEventListener('click',()=>document.getElementById('pack-up').click());
document.getElementById('btn-fullscreen').addEventListener('click',toggleFullscreen);
document.getElementById('btn-home').addEventListener('click',goHome);
document.getElementById('up').addEventListener('change',e=>{
    const files=Array.from(e.target.files);
    if(files.length)processFiles(files);
    e.target.value='';
});
document.getElementById('pack-up').addEventListener('change',async e=>{
    const files=Array.from(e.target.files).map(f=>({path:f.webkitRelativePath||f.name,file:f}));
    if(files.length){
        setStatus('Packing '+files.length+' files...');
        try{await packJam(files);setStatus('Packed successfully');}
        catch(err){setStatus('Pack error: '+err.message);}
    }
    e.target.value='';
});
</script>
</body>
</html>
